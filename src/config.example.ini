# KeySidekick configuration (multi-profile).
# Copy this file to config.ini and edit to your liking.
# The INI format is extended; the old two-section [AIMP]/[Keys] format also works
# (parsed as the "default" profile - backward compatibility).
#
# --- HID Usage IDs (page 0x07), layout-independent ---
#   letters: a=0x04 ... z=0x1D  |  digits: 1=0x1E ... 0=0x27
#   F1=0x3A..F12=0x45  |  Enter=0x28 Esc=0x29 Space=0x2C
#   arrows: Left=0x50 Right=0x4F Up=0x52 Down=0x51
#   modifiers (in byte[0]): LCtrl=0x01 LShift=0x02 LAlt=0x04 LGUI=0x08
#                           RCtrl=0x10 RShift=0x20 RAlt=0x40 RGUI=0x80
#   Full table: docs/HID-USAGE-TABLE.md
#
# --- Action grammar (values in Mappings) ---
#   {F1} / 1 / {Media_Play_Pause}   - send keys to the profile target
#   !switch:<profile>               - switch the active profile
#   !toggle:<profile>               - switch to <profile> and back to the previous one
#   !launch:<path.exe>              - launch an application
#   !app:<nameOrClass>:<keys>       - send keys to another window (multi-app)
#
# --- Key combinations (modifier + key) ---
#   Add +Mod1+Mod2... to a key. Names: Ctrl Shift Alt Win (or LCtrl/RCtrl/...).
#   Example: USAGE_1E+Ctrl+Shift=!switch:aimp   -> Ctrl+Shift+1 switches to the aimp profile
#   The combination fires when ALL required modifier groups are held (Ctrl = any Ctrl).
#
# --- Schema v3 layout ---
#   [General]                  global settings
#   [Application.<id>]         a target application (window class / exe / path / autostart)
#   [Profile.<id>]             a profile; targeted profiles link an application via
#                              ApplicationId=<id>
#   [Profile.<id>.Mappings]    physical key -> action (see action grammar above)
#   The dashboard ("+ Setup keyboard") writes your real DeviceVIDPID for you.

[General]
SchemaVersion=3
# DeviceVIDPID: your dedicated keyboard's VID/PID, lowercase (see Zadig / Device Manager).
# Placeholder below — replace it with YOUR device, or let the dashboard wizard
# ("+ Setup keyboard") detect and write it for you.
DeviceVIDPID=vid_xxxx&pid_yyyy
DefaultProfileId=basic
HTTPPort=8765
HTTPEnabled=1
TrayEnabled=1
EnableLog=1

# ---------- Target application: AIMP ----------
# Where the aimp profile sends its keys (window class / process / path / auto-start).
[Application.aimp]
Name=AIMP
TargetClass=TAIMPMainForm
TargetExe=AIMP.exe
TargetPath=C:\\Program Files (x86)\\AIMP\\AIMP.exe
AutoStart=1

# ---------- Profile: basic ----------
# The keyboard types as a normal keyboard (SendInput re-inject).
# Individual keys can be overridden with an action.
# Here: Esc (0x29) on the dedicated keyboard -> switch to aimp.
[Profile.basic]
Mode=basic

[Profile.basic.Mappings]
USAGE_29=!switch:aimp
# Ctrl+Shift+1 -> switch to aimp (key combination)
USAGE_1E+Ctrl+Shift=!switch:aimp

# ---------- Profile: aimp ----------
# Keys are sent to AIMP (via PostMessage to its window); they are NOT typed into the
# active window. The target window/process lives in [Application.aimp] above.
[Profile.aimp]
Mode=targeted
ApplicationId=aimp

[Profile.aimp.Mappings]
# q -> F1, w -> F2, e -> F3
USAGE_14={F1}
USAGE_1A={F2}
USAGE_08={F3}
# 1-5 -> 1-5
USAGE_1E=1
USAGE_1F=2
USAGE_20=3
USAGE_21=4
USAGE_22=5
# Esc -> back to basic mode
USAGE_29=!switch:basic
# Ctrl+Shift+1 -> back to basic (symmetric to basic->aimp)
USAGE_1E+Ctrl+Shift=!switch:basic
# Multi-app example: key r (0x15) goes to Spotify (if running), not AIMP
# USAGE_15=!app:Spotify:{Media_Next_Track}
